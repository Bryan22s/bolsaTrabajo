spring.application.name=bolsabe

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bolsaempleo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8081

# =====================================================
# JWT
# =====================================================
jwt.secret=BolsaEmpleoProgra4UNASecretKey2026!
jwt.expiration=86400000

# =====================================================
# SUBIDA DE ARCHIVOS (PDFs de curr�culos)
# =====================================================
app.upload.dir=uploads/curriculos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================================
# RECURSOS EST�TICOS
# Sirve el build de React (src/main/resources/static)
# y los PDFs subidos (uploads/curriculos/).
# =====================================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/